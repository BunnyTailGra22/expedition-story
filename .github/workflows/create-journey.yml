name: Create journey

# TEMP: regenerate yari-hotaka-circuit-2026-trek on this branch (no deploy).
# Restored to the form workflow once the journey is generated.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe observations
        run: |
          python3 - <<'PY'
          import json, statistics, urllib.request, collections
          from datetime import timezone, timedelta
          from lib import walks as W, geo
          cfg = json.load(open("journeys/yari-hotaka-circuit-2026-trek/config.json"))
          pl = json.load(urllib.request.urlopen(f"https://api.inaturalist.org/v1/places/{cfg['place_id']}"))["results"][0]
          print(f"place_id {cfg['place_id']} = {pl.get('display_name')}")
          obs = W.fetch(cfg["user_login"], cfg["place_id"], cfg["d1"], cfg["d2"])
          rows = []
          for o in obs:
              c = (o.get("geojson") or {}).get("coordinates")
              t = W._t(o)
              rows.append((o, t, c))
          geo_rows = [r for r in rows if r[2]]
          print(f"{len(obs)} obs · {len(geo_rows)} geo-located")
          days = collections.Counter(t.astimezone(timezone(timedelta(hours=9))).date().isoformat() for _, t, _ in rows if t)
          for d in sorted(days):
              print(f"  {d} (JST): {days[d]} obs")
          if geo_rows:
              clat = statistics.median(r[2][1] for r in geo_rows)
              clng = statistics.median(r[2][0] for r in geo_rows)
              print(f"median centre {clat:.5f},{clng:.5f}")
              print("id | time JST | lat,lng | km from centre | acc m | taxon")
              for o, t, c in sorted(geo_rows, key=lambda r: r[1] or 0):
                  km = geo.hav(c[1], c[0], clat, clng) / 1000
                  tj = t.astimezone(timezone(timedelta(hours=9))).strftime("%m-%d %H:%M") if t else "?"
                  name = ((o.get("taxon") or {}).get("name")) or "?"
                  flag = "  <-- >10 km" if km > 10 else ""
                  print(f"{o['id']} | {tj} | {c[1]:.5f},{c[0]:.5f} | {km:6.1f} | {o.get('positional_accuracy')} | {name}{flag}")
          PY

      - name: Generate journey
        run: python3 generate.py --journey yari-hotaka-circuit-2026-trek

      - name: Rebuild global index
        run: python3 build_site_index.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          git commit -m "Generate yari-hotaka-circuit-2026-trek (TEMP regen workflow)" || echo "nothing to commit"
          git push
